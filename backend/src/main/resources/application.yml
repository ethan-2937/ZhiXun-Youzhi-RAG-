server:
  port: ${APP_PORT:8088}
  servlet:
    session:
      timeout: ${APP_SESSION_TIMEOUT:8h}
      cookie:
        http-only: true
        secure: ${APP_SESSION_COOKIE_SECURE:false}
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: zhixun-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app:
  rag:
    enabled: ${RAG_ENABLED:false}
    embedding:
      base-url: ${EMBEDDING_BASE_URL:http://127.0.0.1:11434/v1}
      api-key: ${EMBEDDING_API_KEY:}
      model: ${EMBEDDING_MODEL:text-embedding-v4}
      dimension: ${EMBEDDING_DIMENSION:1024}
      batch-size: ${EMBEDDING_BATCH_SIZE:8}
      connect-timeout: ${EMBEDDING_CONNECT_TIMEOUT:3s}
      read-timeout: ${EMBEDDING_READ_TIMEOUT:30s}
      max-input-chars: ${EMBEDDING_MAX_INPUT_CHARS:1600}
    knowledge:
      file: ${RAG_KNOWLEDGE_FILE:/knowledge/documents.jsonl}
      raw-directory: ${RAG_RAW_DIRECTORY:/knowledge/raw}
      max-source-bytes: ${RAG_MAX_SOURCE_BYTES:5242880}
      max-raw-file-bytes: ${RAG_MAX_RAW_FILE_BYTES:52428800}
      max-documents: ${RAG_MAX_DOCUMENTS:200}
      max-document-chars: ${RAG_MAX_DOCUMENT_CHARS:100000}
      max-preview-chars: ${RAG_MAX_PREVIEW_CHARS:50000}
      chunk-chars: ${RAG_CHUNK_CHARS:1200}
      chunk-overlap-chars: ${RAG_CHUNK_OVERLAP_CHARS:120}
      max-chunks: ${RAG_MAX_CHUNKS:2000}
    retrieval:
      top-k: ${RAG_TOP_K:4}
      min-score: ${RAG_MIN_SCORE:0.45}
      max-citations: ${RAG_MAX_CITATIONS:3}
      max-excerpt-chars: ${RAG_MAX_EXCERPT_CHARS:260}
    diagnostics:
      enabled: ${RAG_DIAGNOSTICS_ENABLED:false}
      max-candidates: ${RAG_DIAGNOSTICS_MAX_CANDIDATES:50}
  auth:
    mode: ${APP_AUTH_MODE:demo}
    allowed-corp-id: ${DINGTALK_CORP_ID:}
    replay-ttl: ${DINGTALK_AUTH_CODE_REPLAY_TTL:5m}
    demo:
      user-id: test-user-demo-001
      display-name: 演示用户
      department: 产品体验组
    dingtalk:
      client-id: ${DINGTALK_CLIENT_ID:}
      client-secret: ${DINGTALK_CLIENT_SECRET:}
      access-token-url: ${DINGTALK_ACCESS_TOKEN_URL:https://api.dingtalk.com/v1.0/oauth2/accessToken}
      user-by-code-url: ${DINGTALK_USER_BY_CODE_URL:https://oapi.dingtalk.com/topapi/v2/user/getuserinfo}
