name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Make wrappers executable when present
        shell: bash
        run: |
          if [ -f backend/mvnw ]; then chmod +x backend/mvnw; fi
      - name: Verify repository
        shell: pwsh
        run: ./scripts/verify.ps1
